name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier baked into the app"
        required: false
        default: "com.moodwatch.app"
      marketing_version:
        description: "CFBundleShortVersionString"
        required: false
        default: "1.0.0"
  push:
    branches: [ main ]

jobs:
  build:
    name: Archive MoodWatch.app and pack MoodWatch.ipa
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: List schemes
        run: xcodebuild -list -project MoodWatch.xcodeproj

      - name: Archive (no code signing)
        env:
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.moodwatch.app' }}
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version || '1.0.0' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project MoodWatch.xcodeproj \
            -scheme MoodWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MoodWatch.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            | tee build-archive.log
          test -d build/MoodWatch.xcarchive/Products/Applications/MoodWatch.app

      - name: Pack Payload/MoodWatch.app into MoodWatch.ipa
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/MoodWatch.xcarchive/Products/Applications/MoodWatch.app build/Payload/
          cd build
          zip -qry MoodWatch.ipa Payload
          ls -lh MoodWatch.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/MoodWatch.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/MoodWatch.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/MoodWatch.app/Info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoodWatch-unsigned-ipa
          path: build/MoodWatch.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build-archive.log
          if-no-files-found: ignore
          retention-days: 7
